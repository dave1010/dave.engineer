<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — dave.engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        background: #0c0a09;
        color: #d6d3d1;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        place-items: center;
      }

      main {
        width: min(42rem, 100%);
        border-block: 1px solid #292524;
        padding-block: clamp(3rem, 10vw, 7rem);
      }

      .status {
        margin: 0 0 1rem;
        color: #fdba74;
        font-size: 0.875rem;
      }

      h1 {
        margin: 0;
        color: #f5f5f4;
        font-family: "IBM Plex Serif", Georgia, serif;
        font-size: clamp(2.75rem, 9vw, 5.5rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      p {
        max-width: 34rem;
        margin: 1.5rem 0 2rem;
        color: #a8a29e;
        font-size: 1.125rem;
        line-height: 1.6;
      }

      a {
        color: #f5f5f4;
        text-decoration-color: #fb923c;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.35rem;
      }

      a:hover {
        color: #fed7aa;
      }

      a:focus-visible {
        outline: 2px solid #fdba74;
        outline-offset: 0.4rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">404 / Page not found</p>
      <h1>Nothing here.</h1>
      <p>The address may be wrong, or the page may have moved.</p>
      <a href="/">Return to dave.engineer →</a>
    </main>
  </body>
</html>
